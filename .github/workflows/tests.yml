name: data-free tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data-free test dependencies
        run: >-
          python -m pip install
          pytest pandas numpy scipy scikit-learn matplotlib seaborn statsmodels
          openpyxl pyyaml imbalanced-learn
      - name: Run baseline and revision unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests revision_analysis/tests
